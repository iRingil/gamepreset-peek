name: keepalive

# GitHub disables scheduled workflows after 60 days without a push, so a monthly commit keeps them running.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record heartbeat
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: monthly keepalive ping"
          git push
