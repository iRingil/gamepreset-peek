name: Build

# Builds the installer and the portable zip on demand and for every version tag (vX.Y.Z, equal to app.__version__).
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag against the app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import app; print(app.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }
      # The build script runs the Python of the project's .venv.
      - name: Create the virtualenv
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r src/requirements.txt -r src/requirements-dev.txt
      - name: Test with pytest
        run: .venv\Scripts\python.exe -m pytest
      # Compiled C objects and Nuitka's downloads make a rebuild much faster.
      - name: Restore the Nuitka cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ hashFiles('src/requirements*.txt', 'infrastructure/nuitka/build.cmd') }}
          restore-keys: nuitka-
      - name: Build with Nuitka
        shell: cmd
        run: infrastructure\nuitka\build.cmd
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer and the portable zip
        shell: cmd
        run: infrastructure\inno\build.cmd
      - name: Upload the installer and the portable zip
        uses: actions/upload-artifact@v7
        with:
          name: GamePresetPeek
          path: |
            build/GamePresetPeek-*-setup.exe
            build/GamePresetPeek-*-portable.zip
          if-no-files-found: error
