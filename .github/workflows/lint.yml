name: Lint

# The app uses Windows-only APIs, and the PySide6 stubs differ per platform, so the checks run on Windows.
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  # New advisories appear while the code stays unchanged
  schedule:
    - cron: '17 5 * * 1'

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # basedpyright reads the project's packages from .venv (see [tool.basedpyright] in pyproject.toml).
      # Ruff, basedpyright and pip-audit are not project dependencies, so their versions are pinned here.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r src/requirements-dev.txt ruff==0.17.4 basedpyright==1.40.2 pip-audit==2.10.1
      # Audits every installed package, transitive ones included - Dependabot only sees the requirements files
      - name: pip-audit
        run: |
          .venv\Scripts\pip-audit.exe --progress-spinner off
      - name: Ruff
        run: |
          .venv\Scripts\ruff.exe check src tests
          .venv\Scripts\ruff.exe format --check src tests
      - name: basedpyright
        run: |
          .venv\Scripts\basedpyright.exe
