name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
        GamePreset Peek is an unofficial tool and is not affiliated with NVIDIA.
        The presets themselves come from NVIDIA: the app shows them as NVIDIA publishes them.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the window title.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, GPU and RAM
      description: As shown in the app's hardware block; say which ones you chose from the list yourself.
      placeholder: "i7-13700H, RTX 4070 Laptop (chosen), 32 GB"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and resolution
      placeholder: Cyberpunk 2077, 2560x1440
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Русский
        - Deutsch
        - Français
        - Español
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select ...
        2. Click ...
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "Paste the end of %LOCALAPPDATA%\\GamePresetPeek\\logs\\gamepreset-peek.log, or attach the file."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
